<title>Settings, rethought</title>
<meta name="description" content="Mock-up for #321: today's Settings beside two layouts that gather Polku's preferences in one place, on a phone and a desktop.">
<!--
  #321, 2026-10-31: today's Settings beside two new layouts. The plan: docs/plans/issue-321-settings.md.
  Not wired to the app: nothing here is loaded by Polku.

  Today is the panel itself, captured from main at 349971f (its DOM after renderSettingsPanel(), at 1440 x 900).
  The CSS below the page's own is css/app.css at 349971f, only the rules that match Settings and Layers'
  panels, so A and B use the shared controls as they are: .lp-sec, .lg-group, .tg, .seg, .chip, .row, .btn.
  Settings that aren't built yet are marked "planned" with their issue.

  ?v=today|a|b  &theme=light|dark  &planned=coming|show|hide
-->
<style>

.sw { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 22px; background: var(--switch-bg); }
.sw button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: inherit; cursor: pointer; font-weight: 600; font-size: 13px; }

.why p { margin: 4px 0; }
.frames { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.fr-cap { margin: 0 0 6px; font-size: 12.5px; font-weight: 700; color: var(--page-cap); }
/* a stand-in for the map: the glass needs something behind it */
.scene { position: relative; overflow: hidden; border-radius: 18px; box-shadow: 0 2px 12px rgba(0,0,0,.18);
  background: radial-gradient(circle at 30% 20%, #cfe3c0 0 18%, transparent 19%), radial-gradient(circle at 75% 60%, #a9cde8 0 22%, transparent 23%),
    repeating-linear-gradient(35deg, transparent 0 38px, rgba(230,170,60,.55) 38px 41px), repeating-linear-gradient(-60deg, transparent 0 70px, rgba(120,120,120,.35) 70px 72px), #e9efe3; }
:root[data-theme="dark"] .scene { background: radial-gradient(circle at 30% 20%, #20321f 0 18%, transparent 19%), radial-gradient(circle at 75% 60%, #12304a 0 22%, transparent 23%),
    repeating-linear-gradient(35deg, transparent 0 38px, rgba(200,140,40,.45) 38px 41px), repeating-linear-gradient(-60deg, transparent 0 70px, rgba(160,160,160,.25) 70px 72px), #1a1f1b; }
.phone { width: 390px; height: 844px; max-width: 100%; }
.desk { width: 420px; height: 900px; max-width: 100%; }
/* the panel where the app puts it: a phone's above the bottom edge, a desktop's under ⚙ at the top right */
.scene .panel { --sheet-h: 0px; }
.phone .panel { position: absolute; left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; max-height: min(62%, 768px); }
.desk .panel { position: absolute; top: 64px; right: 12px; left: auto; bottom: auto; width: 356px; max-height: calc(100% - 76px); }
.gear { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; background: var(--accent, #2a6); opacity: .9; }
.panel-body { overscroll-behavior: contain; }
/* the mock-up's own marks */
body.no-planned .planned { display: none !important; }
body.pl-coming .cur .t-n, body:not(.pl-coming) .cur .t-soon { display: none; }
/* greyed as the app greys what can't be used now (.onmap .tg.off at .5, .seg button:disabled at .45) */
body.pl-coming .planned { opacity: .5; cursor: not-allowed; }
/* a heading over a switch: the build extends .lp-sec > .tg-text's padding to these */
.lg-group > .tg-text, .lg-group > .planned > .tg-text { padding: 7px 0 8px; }
body:not(.pl-coming) .planned { opacity: .8; }
.speed-box.mock { padding: 4px 0 10px 32px; }
.speed-box.mock h4 { margin: 8px 0 4px; font-size: 12px; }
.tile-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
/* copied from css/app.css at 349971f: the plain row's value and the inline tag ("your route"), not in today's panel */
.row .val { flex: none; max-width: 42%; font-size: var(--font-row); font-weight: var(--weight-name); color: var(--accent); text-align: right; overflow-wrap: break-word; }
.row.danger b, .row.danger > span:first-child { color: var(--bad); }
.cur { margin-left: 4px; font-size: 11.5px; font-weight: 700; color: var(--accent); }
.lg-group > .rows { margin-bottom: 6px; }
.lg-group > .note:first-of-type { margin-top: 0; }
</style>

<template id="today"><aside id="settings-panel" class="panel panel-settings" aria-label="Settings">
    <div class="panel-head"><h2>Settings</h2><button class="panel-close tool" type="button" aria-label="Close"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
    <div id="settings-body" class="panel-body"><section class="lp-sec"><h3>About Polku</h3><button type="button" class="btn" id="btn-changelog">What’s new</button><p class="note">Read recent changes without leaving your route.</p></section><section class="lp-sec"><h3>Your speeds</h3><div class="speed-list rows"><button type="button" class="row speed-sport-row" data-k="mtb" aria-expanded="false"><span><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3.5"></circle><circle cx="18.5" cy="16.5" r="3.5"></circle><path d="M5.5 16.5 9 9h6l3.5 7.5M9 9l3 7.5L15 9M13 5h3l1 4"></path></svg></span><span><b>MTB</b><small>Normal · 20 / 16 / 11 km/h · 600 m/h up</small></span><span class="way-chev"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button><button type="button" class="row speed-sport-row" data-k="gravel" aria-expanded="false"><span><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3.5"></circle><circle cx="18.5" cy="16.5" r="3.5"></circle><path d="M5.5 16.5 10 9h5l3.5 7.5M10 9l2.5 7.5M14 6h2.5l-1.5 3"></path><path d="M2 22h2M7 22h2M12 22h2M17 22h2" opacity=".6"></path></svg></span><span><b>Gravel</b><small>Normal · 25 / 20 / 12 km/h · 700 m/h up</small></span><span class="way-chev"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button><button type="button" class="row speed-sport-row" data-k="road" aria-expanded="false"><span><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3.5"></circle><circle cx="18.5" cy="16.5" r="3.5"></circle><path d="M5.5 16.5 10 9.5h6.5l2 7M10 9.5l2.5 7 4-7M14 5.5h3.2a1.4 1.4 0 0 1 .4 2.7"></path></svg></span><span><b>Road cycling</b><small>Normal · 27 / 15 / 8 km/h · 800 m/h up</small></span><span class="way-chev"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button><button type="button" class="row speed-sport-row" data-k="hike" aria-expanded="false"><span><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="2"></circle><path d="m9 21 2.5-7 3 3V21M11.5 14 12 9l-3 2v3M12 9l3 3 2.5-1"></path><path d="M18 9v12"></path></svg></span><span><b>Hike</b><small>Normal · 5 km/h on the flat</small></span><span class="way-chev"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button><button type="button" class="row speed-sport-row" data-k="trailrun" aria-expanded="false"><span><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="2"></circle><path d="M11.6 7.6 9 13l2.6 3.2-1 4.8M9 13l-2.6 3.5H3M6 10.2l3.6-2 2.6 2.6 3-1.2"></path><path d="m14.5 21 3.5-5 1.6 2 1.4-1.6 1.5 4.6"></path></svg></span><span><b>Trail run</b><small>Normal · 6:00 /km paved · 7:04 trail</small></span><span class="way-chev"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button><button type="button" class="row speed-sport-row" data-k="run" aria-expanded="false"><span><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15" cy="4.5" r="2"></circle><path d="M13.6 7.6 11 13l2.6 3.2-1 4.8M11 13l-2.6 3.5H5M8 10.2l3.6-2 2.6 2.6 3-1.2"></path></svg></span><span><b>Run</b><small>Normal · 5:43 /km paved · 6:19 trail</small></span><span class="way-chev"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button><button type="button" class="row speed-sport-row" data-k="paddle" aria-expanded="false"><span><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 17c2.5 1.5 5 1.5 7.5 0s5-1.5 7.5 0 3.5 1 5 .5"></path><path d="M5 13.5h14l-2 2.5H7Z"></path><path d="m6 5 12 9M4.5 3.8 7 5.7M17 13.3l2.5 1.9"></path></svg></span><span><b>Paddle</b><small>Sea kayak · 6.5 km/h</small></span><span class="way-chev"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button><button type="button" class="row speed-sport-row" data-k="swim" aria-expanded="false"><span><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="6" r="2"></circle><path d="m4 13 5-3.5 3.5 2.5"></path><path d="M2 17c2.5 1.5 5 1.5 7.5 0s5-1.5 7.5 0 3.5 1 5 .5"></path><path d="M2 21c2.5 1.5 5 1.5 7.5 0s5-1.5 7.5 0 3.5 1 5 .5" opacity=".55"></path></svg></span><span><b>Swim</b><small>Normal · 2:24 /100 m</small></span><span class="way-chev"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button></div><p class="note">Polku times your route with these speeds, so they also decide when you reach each place and the weather you meet there. A change applies at once to your route’s legs in that sport. The planner has the same speeds in its drawing menu and in Route › How you go. Kept on this device only.</p></section><section class="lp-sec"><h3>Route planner</h3><div class="seg small full"><button type="button" aria-pressed="true">Side panel (left)</button><button type="button" aria-pressed="false">Bottom panel</button></div><p class="note">Open it with Plan or R. The button beside its fold, and its ⋯ menu, have the same switch. While planning, the departure clock lives inside it.</p></section><section class="lp-sec"><h3>Display</h3><div class="tg-text" id="appearance-h">Appearance</div><div class="way-chips" role="group" aria-labelledby="appearance-h"><button type="button" class="chip" data-appearance="auto" aria-pressed="true"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg><span>Automatic</span></button><button type="button" class="chip" data-appearance="light" aria-pressed="false"><span>Light</span></button><button type="button" class="chip" data-appearance="dark" aria-pressed="false"><span>Dark</span></button><button type="button" class="chip" data-appearance="map" aria-pressed="false"><span>Match the map</span></button></div><p class="note">Automatic follows your device. Match the map is dark over the aerial photos and the night map, and light over the rest. Kept on this device only.</p><label class="tg" for="t-mihmsm"><span class="tg-text">High contrast<small>Thicker trails, solid panels and darker grey words, for bright sunlight</small></span><input type="checkbox" id="t-mihmsm" role="switch"><span class="tg-ui" aria-hidden="true"></span></label><label class="tg" for="t-8srsga"><span class="tg-text">Details on hover<small>Difficulty, surface or name under the mouse · click for everything</small></span><input type="checkbox" id="t-8srsga" checked="" role="switch"><span class="tg-ui" aria-hidden="true"></span></label><label class="tg" for="t-q9z5xc"><span class="tg-text">Moving arrows on the route<small>Chevrons drift along your route the way it goes. They rest when you leave the map alone; off saves a little battery</small></span><input type="checkbox" id="t-q9z5xc" checked="" role="switch"><span class="tg-ui" aria-hidden="true"></span></label><label class="tg" for="t-fgunyr"><span class="tg-text">Trackpad rotates &amp; tilts<small>Two-finger sideways scroll rotates; in 3D, up/down tilts. Pinch zooms</small></span><input type="checkbox" id="t-fgunyr" checked="" role="switch"><span class="tg-ui" aria-hidden="true"></span></label></section><section class="lp-sec"><h3>Offline maps</h3><div class="off-list"><p class="note">Plan a route, then press <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5a4.5 4.5 0 1 1 1-8.9 6 6 0 0 1 11.3 1.9 3.8 3.8 0 0 1-1.3 7"></path><path d="M12 11v9M8.8 16.8 12 20l3.2-3.2"></path></svg> <b>Save offline</b> in the route panel. The trail map, terrain and the route then work without signal.</p><p class="note">Polku uses 491 kB on this device (up to 4.3 GB available).</p></div></section><section class="lp-sec"><h3>Data sources</h3><div class="use-list"><div class="use-row"><div class="use-head"><b>LIPAS</b><small>routes &amp; places, and search</small><span class="use-count" title="Calls this session · today (UTC day)">9 · 9 today</span></div></div><div class="use-row"><div class="use-head"><b>FMI</b><small>rain radar and measured snow (Finland)</small><span class="use-count" title="Calls this session · today (UTC day)">1 · 1 today</span></div><div class="use-win" title="1 of 600 calls per 5 minutes"><span>per 5 minutes</span><div class="use-bar"><i style="width:0.2%"></i></div><small>1 / 600</small></div><div class="use-win" title="1 of 20,000 calls per day"><span>per day</span><div class="use-bar"><i style="width:0.0%"></i></div><small>1 / 20,000</small></div></div><div class="use-row"><div class="use-head"><b>Open-Meteo</b><small>weather</small><span class="use-count" title="Calls this session · today (UTC day)">0 · 0 today</span></div><div class="use-win" title="0 of 600 calls per minute"><span>per minute</span><div class="use-bar"><i style="width:0.0%"></i></div><small>0 / 600</small></div><div class="use-win" title="0 of 5,000 calls per hour"><span>per hour</span><div class="use-bar"><i style="width:0.0%"></i></div><small>0 / 5,000</small></div><div class="use-win" title="0 of 10,000 calls per day"><span>per day</span><div class="use-bar"><i style="width:0.0%"></i></div><small>0 / 10,000</small></div></div><p class="note">Counted on this device. Open-Meteo counts every location as a call. The providers count per internet connection, so other devices on the same network add to their totals.</p></div></section><section class="lp-sec"><h3>Routing server (optional)</h3><p class="note">Routes come from brouter.de, a free public server that takes about a dozen routes a minute from one device. If you run BRouter yourself, enter its address — for one on this computer, http://localhost:17777/brouter (see tools/brouter-local.sh). Empty means brouter.de.</p><div class="key-row"><input type="url" placeholder="https://brouter.de/brouter" value="" autocomplete="off" spellcheck="false" aria-label="Routing server address"><button type="button" class="btn">Save</button></div><p class="note"></p></section><section class="lp-sec"><h3>MML API key (optional)</h3><p class="note">Maastokartta works without a key via Kapsi. A key adds the official MML WMTS service as an extra base and overlay. Keys are free from <a href="https://www.maanmittauslaitos.fi/rajapinnat/api-avaimen-ohje" target="_blank" rel="noopener">maanmittauslaitos.fi</a> and is stored only in this browser.</p><div class="key-row"><input type="password" placeholder="Paste your MML API key" value="" autocomplete="off" spellcheck="false"><button type="button" class="btn">Save</button></div></section></div>
  </aside></template>

<script>
const WHY = {
  today: '<p><b>Today</b> (main at 349971f). About Polku comes first, and on a phone Display starts a screen and a half down. Distance marks, 3D height and hidden Heads-up are elsewhere, and twelve planned settings have no place yet.</p>',
  a: '<p><b>A: one list.</b> Today\'s single scroll, regrouped in eleven groups, the ones people use most first and About last. Nothing folds, so nothing takes a tap more than today; it\'s long, about 3,000 px with every planned setting.</p>',
  b: '<p><b>B: folding groups (chosen 2026-10-31).</b> Eleven groups, folded like Layers\' groups, with the same control. Settings opens on its list of groups, short enough for one phone screen, and each group stays open or folded as you leave it. Every setting is a tap away, and none is further down than the eleventh row.</p>',
};
const $ = (s, el = document) => el.querySelector(s);
const ic = (d, s = 20) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const EYE_OFF = '<path d="M3 3l18 18"/><path d="M10.6 5.1Q11.3 5 12 5c5 0 9 4.5 10 7a12.6 12.6 0 0 1-2.7 3.8M6.6 6.6C4.3 8 2.7 10.2 2 12c1 2.5 5 7 10 7 1.9 0 3.6-.6 5-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
let uid = 0;
const tg = (label, line, on = false, cls = '', tag = '') => { const id = `m-${++uid}`; return `<label class="tg ${cls}" for="${id}"><span class="tg-text">${tag ? `<span>${label}${tag}</span>` : label}<small>${line}</small></span><input type="checkbox" id="${id}" role="switch"${on ? ' checked' : ''}><span class="tg-ui" aria-hidden="true"></span></label>`; };
const row = (icon, name, line, val = '', tag = '') => `<button type="button" class="row${tag ? ' planned' : ''}"><span>${ic(icon)}</span><span><b>${name}${tag}</b>${line ? `<small>${line}</small>` : ''}</span>${val ? `<span class="val">${val}</span>` : `<span class="way-chev">${ic(I.chev, 16)}</span>`}</button>`;
const rows = (...r) => `<div class="rows">${r.join('')}</div>`;
const I = { chev: '<path d="m9 6 6 6-6 6"/>', layers: '<path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/><path d="m2 18 10 5 10-5" opacity=".55"/>', search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>', download: '<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>', upload: '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>', link: '<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>', info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', reset: '<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/>' };
const seg = (opts, on, label) => `<div class="seg small full" role="group" aria-label="${label}">${opts.map((o) => `<button type="button" aria-pressed="${o === on}">${o}</button>`).join('')}</div>`;
const planned = (n) => `<span class="cur"><span class="t-soon">Coming</span><span class="t-n">planned #${n}</span></span>`;
// a planned setting: its control as it will work, or greyed and disabled with Coming until it's built (the user's choice, 2026-10-31)
const soon = (ctl) => `<div class="planned">${ctl}</div>`;

// ids go (each panel is drawn twice), and with them each label's for: a label around its input names it anyway
const unid = (el) => { for (const x of [el, ...el.querySelectorAll('[id], [for]')]) { x.removeAttribute('id'); x.removeAttribute('for'); } };

// the parts of today's panel that move as they are
function parts() {
  const t = $('#today').content.cloneNode(true);
  const secs = [...t.querySelectorAll('.lp-sec')];
  const by = (name) => secs.find((s) => s.querySelector('h3').textContent.startsWith(name));
  const disp = by('Display');
  const tgs = [...disp.querySelectorAll('.tg')];
  const pick = (re) => tgs.find((l) => re.test(l.textContent));
  const keep = (el) => { unid(el); return el.outerHTML; };
  return {
    about: keep(by('About').querySelector('.btn')),
    speeds: by('Your speeds').querySelector('.speed-list'),
    planner: by('Route planner'),
    appearance: [disp.querySelector('.tg-text'), disp.querySelector('.way-chips'), disp.querySelector('.note')].map(keep).join(''),
    contrast: keep(pick(/High contrast/)),
    hover: keep(pick(/hover/)),
    trackpad: keep(pick(/Trackpad/)),
    arrows: keep(pick(/Moving arrows/)),
    offline: keep(by('Offline maps').querySelector('.off-list')),
    usage: keep(by('Data sources').querySelector('.use-list')),
    router: [...by('Routing server').children].filter((c) => c.tagName !== 'H3').map(keep).join(''),
    mml: [...by('MML').children].filter((c) => c.tagName !== 'H3').map(keep).join(''),
  };
}

function groups(P, desk) {
  const tiles = { mtb: ['Trail colours', 'Trail details', 'Official routes', 'Waymarked MTB', 'Rain radar'], paddle: ['Depths', 'Fairways', 'Wind', 'Ships', 'Rain radar'] };
  const speeds = P.speeds.cloneNode(true);
  speeds.querySelectorAll('.speed-sport-row').forEach((r) => { r.dataset.tiles = (tiles[r.dataset.k] || tiles.mtb).join(', '); });
  const head = (name, n) => `<div class="tg-text"><span>${name} ${planned(n)}</span></div>`;
  return [
    { id: 'sports', title: 'Speeds and tiles by sport', html: speeds.outerHTML +
      `<p class="note">Each sport's speeds time your route, and so decide the weather you meet on the way. Its five tiles are the ones Layers shows for it. Kept on this device only.</p>` },
    { id: 'display', title: 'Display', html: P.appearance +
      soon(head('Text and buttons', 325) + seg(['Smaller', 'Standard', 'Larger'], 'Standard', 'Text and buttons')) +
      P.contrast +
      soon(tg('Colours for colour blindness', 'Difficulty, the profile and warnings in colours that stay apart', false, '', planned(324))) +
      soon(tg('Less motion', 'Panels appear without sliding; the route\'s arrows stand still', false, '', planned(327))) +
      soon(tg('Fewer effects', 'No glass or shadows, for slower phones', false, '', planned(330))) },
    { id: 'lang', title: 'Language and units', html:
      soon(head('Language', 184) + seg(['Automatic', 'English', 'Suomi', 'Svenska'], 'Automatic', 'Language')) +
      soon(head('Units', 326) + seg(['Metric', 'Imperial'], 'Metric', 'Units')) },
    { id: 'route', title: 'Route arrows and marks', html: P.arrows +
      tg('Distance marks', 'Every 1, 5, 10 or 25 km, by the route\'s length', true) +
      tg('Arrival times at marks', 'The clock time you reach each mark', true) +
      tg('Elapsed time at marks', 'From departure, with stops and changeovers', true) +
      soon(tg('Trails show through the route', 'So the trail\'s colours stay visible under it', false, '', planned(199))) },
    { id: 'map', title: 'Map and planner', html:
      rows(row(I.layers, 'Layers', 'The base map, trails, 3D, the timeline and weather on the map')) +
      `<label class="range"><span>3D height</span><input type="range" min="1" max="3" step="0.1" value="1.4" aria-label="3D height"></label>` +
      P.hover + P.trackpad +
      soon(tg('Turn the map with two fingers', 'Off keeps north up; a pinch only zooms', true, '', planned(328))) +
      soon(head('When Polku opens', 329) + seg(['Where you left off', 'A fresh start'], 'Where you left off', 'When Polku opens')) +
      soon(tg('Keep the screen on while following', 'Only while Follow me is on', false, '', planned(331))) +
      (desk ? `<div class="tg-text">Route planner</div>${P.planner.querySelector('.seg').outerHTML}` : '') },
    { id: 'hidden', title: 'Hidden Heads-up', html:
      rows(row(EYE_OFF, 'Steps', '', 'Show again'), row(EYE_OFF, 'Gates and barriers', '', 'Show again')) +
      `<p class="note">A Heads-up row's ⋯ hides a kind you don't need.</p>` },
    { id: 'offline', title: 'Offline maps', html: P.offline },
    { id: 'device', title: 'Saved on this device', html:
      rows(row(I.search, 'Recent searches', '6 places', 'Clear'),
        row(I.download, 'Export a copy', 'Your route, settings and places, as a file', '', planned(282)),
        row(I.upload, 'Import a copy', 'From another device', '', planned(282)),
        row(I.reset, 'Reset settings', 'Your route and offline maps stay', '', planned(332))) +
      `<p class="note">Polku keeps all of this here, and nowhere else.</p>` },
    { id: 'accounts', title: 'Strava and Garmin', html:
      rows(row(I.link, 'Strava', 'Your past trips as a heatmap, and your real speeds', 'Connect', planned(188)),
        row(I.link, 'Garmin', 'Send a route to your watch or bike computer', 'Connect', planned(188))) +
      `<p class="note">Optional: Polku works without an account.</p>` },
    { id: 'data', title: 'Data sources', html: P.usage + `<div class="tg-text">Routing server (optional)</div>${P.router}<div class="tg-text">MML API key (optional)</div>${P.mml}` },
    { id: 'about', title: 'About Polku', html: P.about +
      rows(row(I.info, 'How to use Polku', '', '', planned(321)), row(I.info, 'Credits and licence', '', '', planned(321))) },
  ];
}

function panel(v, desk) {
  if (v === 'today') {
    const el = $('#today').content.firstElementChild.cloneNode(true);
    unid(el);
    if (!desk) el.querySelector('.lp-sec:nth-child(3)')?.remove(); // (Route planner is a desktop's only)
    return el;
  }
  const P = parts();
  const el = document.createElement('aside');
  el.className = 'panel panel-settings';
  el.setAttribute('aria-label', 'Settings');
  el.innerHTML = `<div class="panel-head"><h2>Settings</h2><button class="panel-close tool" type="button" aria-label="Close">${ic('<path d="M6 6l12 12M18 6 6 18"/>', 18)}</button></div><div class="panel-body"></div>`;
  const body = el.querySelector('.panel-body');
  for (const g of groups(P, desk)) {
    const title = g.title;
    if (v === 'a') body.insertAdjacentHTML('beforeend', `<section class="lp-sec"><h3>${title}</h3>${g.html}</section>`);
    else body.insertAdjacentHTML('beforeend', `<details class="lg-group"${g.open ? ' open' : ''}><summary><span class="lg-title">${title}</span>${g.count ? `<span class="lg-count">${g.count}</span>` : ''}</summary>${g.html}</details>`);
  }
  return el;
}

// a sport's row opens its speeds and its five tiles (the speed editor itself is the planner's, as today)
document.addEventListener('click', (e) => {
  const r = e.target.closest('.speed-sport-row');
  if (r && !r.closest('template')) {
    const open = r.getAttribute('aria-expanded') === 'true';
    r.setAttribute('aria-expanded', String(!open));
    if (open) { r.nextElementSibling?.classList.contains('speed-box') && r.nextElementSibling.remove(); return; }
    const box = document.createElement('div');
    box.className = 'speed-box mock';
    const t = (r.dataset.tiles || '').split(', ').filter(Boolean);
    box.innerHTML = `<p class="note">The speed editor, as today.</p>` + (t.length ? `<h4>Tiles in Layers</h4><div class="tile-chips">${t.map((x) => `<span class="chip"><span>${x}</span></span>`).join('')}</div><button type="button" class="btn">Edit tiles</button>` : '');
    r.after(box);
  }
  const hb = e.target.closest('.row');
  if (hb && hb.querySelector('.val')?.textContent === 'Show again') hb.remove();
  const sb = e.target.closest('.seg button');
  if (sb) sb.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === sb)));
  const ch = e.target.closest('.way-chips .chip');
  if (ch) ch.parentElement.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', String(b === ch)));
});

const q = new URLSearchParams(location.search);
const st = { v: q.get('v') || 'b', theme: q.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), planned: q.get('planned') || 'coming' };
function render() {
  document.documentElement.dataset.theme = st.theme;
  document.body.classList.toggle('no-planned', st.planned === 'hide');
  document.body.classList.toggle('pl-coming', st.planned === 'coming');
  setTimeout(() => document.querySelectorAll('.planned :is(input, button), button.planned').forEach((el) => { el.disabled = st.planned === 'coming'; }));
  for (const sw of document.querySelectorAll('.sw')) for (const b of sw.children) b.setAttribute('aria-pressed', String(st[sw.dataset.sw] === b.dataset.val));
  $('#why').innerHTML = WHY[st.v] + (st.v !== 'today' ? '<p>Planned settings show as the app could ship them now, greyed and disabled with Coming, or as they\'ll work, with their issue.</p>' : '');
  for (const [id, desk] of [['f-phone', false], ['f-desk', true]]) { const f = $(`#${id}`); f.querySelector('.panel')?.remove(); f.append(panel(st.v, desk)); }
  history.replaceState(null, '', `?${new URLSearchParams(st)}`);
}
for (const sw of document.querySelectorAll('.sw')) sw.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { st[sw.dataset.sw] = b.dataset.val; render(); } });
render();
</script>
</body>
</html>
