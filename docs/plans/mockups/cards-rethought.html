body.cr { background: var(--page); }
#map { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }

@starting-style { .cr-line { opacity: 0; transform: scale(0.96); } }
.cr-line > span:first-child { display: grid; gap: 1px; min-width: 0; }
.cr-line b { font-size: var(--font-control); font-weight: var(--weight-strong); overflow-wrap: anywhere; }
.cr-line small { font-size: var(--font-small); font-weight: var(--weight-regular); color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.cr-line .ic { flex: none; color: var(--muted); }
.cr-line:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.cr-line:active { transform: scale(0.97); }
/* the desktop's card grows from the corner nearest its spot */
.card-float.cr-card .maplibregl-popup-content { transition: opacity var(--t-open) var(--ease-out), transform var(--t-open) var(--ease-out); }
@starting-style { .card-float.cr-card .maplibregl-popup-content { opacity: 0; transform: scale(0.97); } }
.card-float.cr-card.maplibregl-popup-anchor-top-left .maplibregl-popup-content { transform-origin: 0 0; }
.card-float.cr-card.maplibregl-popup-anchor-top-right .maplibregl-popup-content { transform-origin: 100% 0; }
.card-float.cr-card.maplibregl-popup-anchor-bottom-left .maplibregl-popup-content { transform-origin: 0 100%; }
.card-float.cr-card.maplibregl-popup-anchor-bottom-right .maplibregl-popup-content { transform-origin: 100% 100%; }
/* the hover's line on a desktop is .hover-tip itself (css/app.css), at the pointer */
.hover-tip.cr-tip { pointer-events: none; }

/* the card on a phone: at the foot of the screen, at two heights (the card, then all of it) */
.cr-sheet { position: fixed; left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); z-index: 6; display: flex; flex-direction: column;

  transition: height var(--t-sheet) var(--ease-drawer), transform var(--t-sheet) var(--ease-drawer), opacity var(--t-open) var(--ease-out); }
.cr-sheet.entering { transform: translateY(calc(100% + 16px)); }
.cr-sheet.leaving { transition-duration: var(--t-open); }
.cr-sheet.dragging { transition: none; }

.cr-sheet[data-step="card"] > .pl-way.card { overflow-y: hidden; }

@media (prefers-reduced-transparency: reduce) { .cr-sheet { background: var(--surface-solid); backdrop-filter: none; } }

/* the profile: a small one, coloured as the map, and Colour by's choices under it */

.cr-prof svg { display: block; width: 100%; height: 100%; overflow: visible; }
.cr-prof .ax { position: absolute; left: 0; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

.cr-by { margin-top: 2px; }
.cr-by .chip .dot { margin: 0; }
.cr-legend { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: -2px 0 0; font-size: var(--font-small); color: var(--muted); }

.cr-panel .row small { color: var(--muted); }
.cr-sheetpanel { position: fixed; inset: auto 0 0 0; z-index: 9; max-height: 82dvh; overflow-y: auto; overscroll-behavior: contain; padding: 6px 16px max(16px, env(safe-area-inset-bottom));

.cr-btns { display: grid; gap: 0; margin: 0 -2px; }

.cr-btn b { font-weight: var(--weight-name); }

.cr-btn .seg button { font-size: var(--font-small); }

  background: var(--surface-solid); color: var(--text); box-shadow: var(--shadow); font-size: var(--font-small); }
.cr-status[hidden] { display: none; }
.cr-toast { top: auto; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 12px); }
body.cr-shell { overflow: auto; display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100dvh; }
body.cr-shell #map { display: none; }
.cr-side { height: 100dvh; overflow-y: auto; padding: 16px 16px 40px; background: var(--surface-solid); border-right: 1px solid var(--line); }
.cr-stage { height: 100dvh; overflow: auto; display: flex; align-items: flex-start; justify-content: center; gap: 20px; padding: 16px; }
.cr-fig { margin: 0; display: grid; gap: 6px; justify-items: start; }

.cr-frame { position: relative; overflow: hidden; border-radius: 28px; box-shadow: 0 0 0 1px var(--line), var(--shadow); background: var(--page); }
.cr-frame.desk { border-radius: 10px; }
.cr-frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: var(--page); }

  const p = new URLSearchParams({ s: CFG.scene, v: CFG.v, ...(CFG.mode ? { m: CFG.mode } : {}), ...(CFG.sport ? { sp: CFG.sport } : {}), fork: CFG.fork, d: CFG.data, size: CFG.size, show: CFG.show, ...(CFG.b ? { b: CFG.b } : {}), ...extra });

}

// ================================================================ the panel: scenes, the moment, the data, the buttons

    ...Object.entries(choices).map(([k, words]) => h('button', { type: 'button', 'aria-pressed': String(k === value), onclick: () => set(k) }, words)));
}

        onclick: () => { CFG.scene = s.id; CFG.mode = ''; CFG.sport = ''; onChange('scene'); } });

    h('p', {}, 'Where a piece meets two or more that continue it, which way the pick goes on. #574 doesn’t say: choose.'));

function copyChoices(btn) {

// ================================================================ the shell on a Mac: the panel, Today and new side by side
if (SHELL) {
  document.body.classList.add('cr-shell');
  const side = h('aside', { class: 'cr-side' }), stage = h('main', { class: 'cr-stage' });
  document.body.append(side, stage);
  const frames = {};
  const SIZES = { 390: [390, 844, 1], 360: [360, 740, 1], 200: [195, 422, 2], desk: [1440, 900, 1] };
  const post = () => { for (const [v, f] of Object.entries(frames)) f.contentWindow?.postMessage({ cr: 'cfg', cfg: { ...CFG, v } }, location.origin); };
  function layout() {
    stage.replaceChildren();
    for (const k of Object.keys(frames)) delete frames[k];
    const [w, hgt, zoom] = SIZES[CFG.size];
    const shown = CFG.size === 'desk' ? [CFG.show === 'today' ? 'today' : 'new'] : CFG.show === 'new' ? ['new'] : ['today', 'new'];
    const room = (innerWidth - 340 - 32 - 20 * (shown.length - 1)) / shown.length;
    const scale = Math.min(1, (innerHeight - 70) / (hgt * zoom), room / (w * zoom));
    for (const v of shown) {
      const src = `${location.pathname}?${writeUrl({ f: 1, v })}`;
      const fr = h('iframe', { src, title: v === 'today' ? 'Today, as main draws it' : 'New, as #574 decides', width: w, height: hgt, style: `width:${w}px;height:${hgt}px;transform:scale(${zoom * scale})` });
      frames[v] = fr;
      stage.append(h('figure', { class: 'cr-fig' },
        h('figcaption', {}, h('b', {}, v === 'today' ? 'Today' : 'New'), ` · ${v === 'today' ? 'the card as the app on this branch draws it' : 'as #574 decides'}${zoom > 1 ? ' · at 200 %' : ''}`),
        h('div', { class: `cr-frame${CFG.size === 'desk' ? ' desk' : ''}`, style: `width:${w * zoom * scale}px;height:${hgt * zoom * scale}px` }, fr)));
    }
  }
  const sync = (what) => {
    history.replaceState(null, '', `?${writeUrl()}`);
    renderPanel(side, sync, { shell: true });
    if (what === 'size') layout(); else post();
  };
  addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data || !e.data.cr) return;
    if (e.data.cr === 'ready') post();
    // a tap in one frame is made in the other too, so the two stay side by side
    if (e.data.cr === 'tap') for (const [v, f] of Object.entries(frames)) if (f.contentWindow !== e.source) f.contentWindow?.postMessage(e.data, location.origin);
  });
  addEventListener('resize', () => layout());
  renderPanel(side, sync, { shell: true });
  layout();
} else {
  initScreen();
}

// ================================================================ the screen: the map, the pick, the line and the card
function initScreen() {
  const wide = () => innerWidth > 720;
  const touchy = () => matchMedia('(pointer: coarse)').matches;
  const demSource = new mlcontour.DemSource({ url: DEM_URL, encoding: 'terrarium', maxzoom: DEM_MAXZOOM, worker: true, cacheSize: 120, timeoutMs: 15000 });
  demSource.setupMaplibre(maplibregl);
  const ctx = {
    demTiles: demSource.sharedDemProtocolUrl,
    contourTiles: demSource.contourProtocolUrl({ multiplier: 1, thresholds: { 9: [100, 500], 10: [50, 250], 11: [20, 100], 12: [10, 50], 13: [5, 25], 14: [5, 25], 15: [2.5, 10], 16: [2.5, 10] }, elevationKey: 'ele', levelKey: 'level', contourLayer: 'contours', overzoom: 1 }),
    data: {},
  };
  const mapState = () => ({
    activity: sportOf(), base: 'trail', trailColors: 'down', highContrast: false, hillshade: true, contours: true, terrain3d: false, labelsDown: false, labelsUp: false,
    weather: { wind: false, temp: false, rain: false }, exaggeration: 1.4, mmlKey: '', overlays: { ...ACTIVITY_OVERLAYS[sportOf()], roadworks: true }, overlayOpacity: {}, trailDetails: false,
  });
  const sc0 = sceneOf(CFG.scene);
  const map = new maplibregl.Map({ container: 'map', style: buildStyle(mapState(), ctx), center: sc0.at, zoom: sc0.z, maxPitch: 60, attributionControl: false, dragRotate: false });
  installIcons(map);
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');
  window.cr = { map, CFG };
  let styled = sportOf();

  // ---------------------------------------------------------------- the pick's own layers, on top of the app's
  const EMPTY = { type: 'FeatureCollection', features: [] };
  const zi = (...s) => ['interpolate', ['linear'], ['zoom'], ...s];
  function addMine() {
    if (map.getSource('cr-pick')) return;
    for (const id of ['cr-area', 'cr-branch', 'cr-pick', 'cr-route', 'cr-ring']) map.addSource(id, { type: 'geojson', data: ctx.data[id] || EMPTY });
    map.addLayer({ id: 'cr-area-fill', type: 'fill', source: 'cr-area', paint: { 'fill-color': '#111827', 'fill-opacity': 0.06 } });
    map.addLayer({ id: 'cr-area-casing', type: 'line', source: 'cr-area', layout: { 'line-join': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': 6, 'line-opacity': 0.9 } });
    map.addLayer({ id: 'cr-area-line', type: 'line', source: 'cr-area', layout: { 'line-join': 'round' }, paint: { 'line-color': '#111827', 'line-width': 2.5 } });
    map.addLayer({ id: 'cr-route-casing', type: 'line', source: 'cr-route', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': zi(8, 5, 16, 11), 'line-opacity': 0.9 } });
    map.addLayer({ id: 'cr-route-line', type: 'line', source: 'cr-route', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': getComputedStyle(document.documentElement).getPropertyValue('--route').trim() || '#e11d48', 'line-width': zi(8, 3, 16, 6.5) } });
    // the pick: a soft dark shadow, a white casing, then its colours (the route's look, kept apart from the route by the shadow)
    for (const [src, w] of [['cr-branch', 0.75], ['cr-pick', 1]]) {
      map.addLayer({ id: `${src}-shadow`, type: 'line', source: src, layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#0b1220', 'line-width': zi(10, 9 * w, 16, 20 * w), 'line-blur': zi(10, 3, 16, 6), 'line-opacity': 0.35 } });
      map.addLayer({ id: `${src}-casing`, type: 'line', source: src, layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': zi(10, 6 * w, 16, 13 * w) } });
      map.addLayer({ id: `${src}-line`, type: 'line', source: src, layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': ['coalesce', ['get', 'color'], '#374151'], 'line-width': zi(10, 3.5 * w, 16, 7.5 * w) } });
    }
    map.addLayer({ id: 'cr-ring', type: 'circle', source: 'cr-ring', paint: { 'circle-radius': 13, 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-color': '#111827', 'circle-stroke-width': 3 } });
  }
  const setData = (id, fc) => { ctx.data[id] = fc; const s = map.getSource(id); if (s) s.setData(fc); };
  map.on('load', () => { addMine(); if (!wide()) document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show'); ready(); });
  function restyle() { if (styled === sportOf()) return; styled = sportOf(); map.setStyle(buildStyle(mapState(), ctx), { diff: true }); addMine(); }

  // ---------------------------------------------------------------- the ways: one Overpass query per z14 tile, cached a week
  // (as the trail details' tiles, js/trails.js, with the streets added: what a tap on any way needs; z14, a quarter of
  // the trail details' z13, as a town's z13 tile of every way timed out on the public mirrors on 2026-10-29)
  const TILE_Z = 14;
  const WAY_RE = '^(trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|pedestrian|track|path|footway|cycleway|bridleway|steps)(_link)?$';
  const KEEP = ['highway', 'name', 'ref', 'surface', 'smoothness', 'tracktype', 'lit', 'width', 'bicycle', 'foot', 'horse', 'access', 'motor_vehicle', 'segregated', 'cycleway', 'cycleway:left', 'cycleway:right', 'cycleway:both',
    'oneway', 'oneway:bicycle', 'mtb:scale', 'mtb:scale:uphill', 'sac_scale', 'trail_visibility', 'winter_service', 'snowplowing', 'piste:type', 'bicycle:conditional', 'bridge', 'tunnel', 'maxspeed', 'sidewalk', 'sidewalk:both', 'service', 'footway', 'informal'];
  const pickTags = (t = {}) => Object.fromEntries(KEEP.filter((k) => t[k] != null).map((k) => [k, t[k]]));
  const waysQuery = (x, y) => { const [w, s, e, n] = tileBounds(x, y, TILE_Z); return `[out:json][timeout:40];way[highway~"${WAY_RE}"](${s.toFixed(6)},${w.toFixed(6)},${n.toFixed(6)},${e.toFixed(6)});out body geom qt;`; };
  const slimWays = (json) => {
    if (json.remark && /error|timed out|out of memory/i.test(json.remark)) throw new Error(`Overpass: ${json.remark}`);
    return { v: 1, w: (json.elements || []).filter((el) => el.type === 'way' && el.geometry && el.nodes).map((el) => [el.id, pickTags(el.tags), [el.nodes[0], el.nodes[el.nodes.length - 1]], el.geometry.flatMap((p) => [+p.lon.toFixed(5), +p.lat.toFixed(5)])]) }; // (the ends' nodes are all the join needs)
  };
  const tiles = new Map(), loaded = new Set(), ways = new Map(), ends = new Map();
  const tileOf = ([lon, lat]) => lonLatToTile(lon, lat, TILE_Z).map(Math.floor);
  // Overpass is asked as the app asks it for a tap (three mirrors at once); when none answers, the scenes' ways come
  // from a recording made on 2026-10-29 (cards-rethought-ways.json), and the card says so
  let recording = null;
  const recorded = () => (recording ||= request('polku', new URL('cards-rethought-ways.json', location.href).href).then((r) => r.json()).then((d) => { index(d, true); return d; }));
  function loadTile([x, y]) {
    const k = `${x}/${y}`;
    if (!tiles.has(k)) {
      const p = (failing() || q.has('rec') ? Promise.reject(new Error('Overpass')) : cachedOverpass(`cr-ways/${TILE_Z}/${k}`, waysQuery(x, y), slimWays, { race: true }))
        .then((d) => { index(d); loaded.add(k); return d; })
        .catch(async () => { const d = await recorded(); loaded.add(k); return d; });
      p.catch(() => tiles.delete(k));
      tiles.set(k, p);
    }
    return tiles.get(k);
  }
  function index(d, rec = false) {
    for (const [id, tags, nodes, flat] of d.w) {
      if (ways.has(id)) continue;
      const coords = [];
      for (let i = 0; i < flat.length; i += 2) coords.push([flat[i], flat[i + 1]]);
      const w = { id, tags, nodes, coords, len: lineLength(coords), rec };
      ways.set(id, w);
      for (const n of new Set([nodes[0], nodes[nodes.length - 1]])) { if (!ends.has(n)) ends.set(n, []); ends.get(n).push(w); }
    }
  }
  const isLoaded = (ll) => loaded.has(tileOf(ll).join('/'));

  // the way nearest the tap within a finger's (or a pointer's) reach, from the tiles that have loaded
  function nearestWay(ll, px) {
    const m = (40075016.686 * Math.cos((ll[1] * Math.PI) / 180)) / (512 * 2 ** map.getZoom()) * px;
    let best = null;
    for (const w of ways.values()) {
      const c = w.coords;
      for (let i = 1; i < c.length; i++) {
        const r = pointSegment(ll, c[i - 1], c[i]);
        if (r.d < m && (!best || r.d < best.d)) best = { w, d: r.d };
      }
    }
    return best && best.w;
  }

  // ---------------------------------------------------------------- what one thing is (#574's rule 3)
  // Pieces that continue each other (one ends where the next begins) join when they have the same name; unnamed ones
  // join while their kind stays the same. At a fork: the straightest (or every branch, or stop: CFG.fork).
  const KIND_NAME = { path: 'Path', footway: 'Footpath', cycleway: 'Cycleway', track: 'Track', steps: 'Steps', street: 'Street', road: 'Road', bridleway: 'Bridleway', pedestrian: 'Pedestrian street' };
  const bikeOn = (t) => ['designated', 'yes'].includes(t.bicycle);
  function kindOf(t) {
    const hw = String(t.highway || '').replace(/_link$/, '');
    if (hw === 'path') return 'path';
    if (hw === 'footway' || hw === 'pedestrian') return bikeOn(t) ? 'cycleway' : hw === 'pedestrian' ? 'pedestrian' : 'footway';
    if (['cycleway', 'track', 'steps', 'bridleway'].includes(hw)) return hw;
    if (['residential', 'living_street', 'unclassified', 'service'].includes(hw)) return 'street';
    return 'road';
  }
  const joinKey = (t) => (t.name ? `n:${t.name}` : `k:${kindOf(t)}`);
  const angle = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
  function walk(seed) {
    const key = joinKey(seed.tags), used = new Set([seed]);
    let chain = [{ w: seed, rev: false }];
    const stops = {};
    let total = seed.len;
    for (const side of ['end', 'start']) {
      const c0 = seed.coords;
      let node = side === 'end' ? seed.nodes[seed.nodes.length - 1] : seed.nodes[0];
      let at = side === 'end' ? c0[c0.length - 1] : c0[0], from = side === 'end' ? c0[c0.length - 2] : c0[1];
      for (;;) {
        const cands = (ends.get(node) || []).filter((w) => !used.has(w) && joinKey(w.tags) === key);
        if (!cands.length) { stops[side] = { why: 'end', at }; break; }
        if (cands.length > 1 && CFG.fork === 'stop') { stops[side] = { why: 'fork', at }; break; }
        if (total > 25000) { stops[side] = { why: 'long', at }; break; }
        const out = bearing(from, at);
        const best = cands.map((w) => { const fwd = w.nodes[0] === node; const next = fwd ? w.coords[1] : w.coords[w.coords.length - 2]; return { w, fwd, turn: angle(out, bearing(at, next)) }; })
          .sort((a, b) => a.turn - b.turn)[0];
        used.add(best.w);
        total += best.w.len;
        const wc = best.w.coords;
        if (side === 'end') chain.push({ w: best.w, rev: !best.fwd }); else chain.unshift({ w: best.w, rev: best.fwd });
        node = best.fwd ? best.w.nodes[best.w.nodes.length - 1] : best.w.nodes[0];
        at = best.fwd ? wc[wc.length - 1] : wc[0];
        from = best.fwd ? wc[wc.length - 2] : wc[1];
        if (node === (side === 'end' ? seed.nodes[0] : seed.nodes[seed.nodes.length - 1])) { stops[side] = { why: 'loop', at }; break; } // round the block
      }
    }
    // every branch: the same name (or kind) reached from the chain's ends, drawn too (the profile follows the chain)
    const branches = [];
    if (CFG.fork === 'all') {
      const seen = new Set(chain.map((x) => x.w)), todo = chain.map((x) => x.w);
      while (todo.length && branches.length < 400) {
        const w = todo.pop();
        for (const n of [w.nodes[0], w.nodes[w.nodes.length - 1]]) for (const x of ends.get(n) || []) if (!seen.has(x) && joinKey(x.tags) === key) { seen.add(x); branches.push(x); todo.push(x); }
      }
    }
    return { chain, branches, stops };
  }
  // the chain, and the tiles its ends run into (a long street leaves the tile): up to sixteen tiles in all
  async function join(seed) {
    let j = walk(seed);
    for (let k = 0; k < 6; k++) {
      const out = Object.values(j.stops).filter((s) => s.why === 'end' && !isLoaded(s.at));
      if (!out.length || loaded.size >= 16) break;
      await Promise.all(out.map((s) => loadTile(tileOf(s.at)).catch(() => null)));
      j = walk(seed);
    }
    return j;
  }
  function lineOf(chain) {
    const coords = [], attrs = [];
    for (const { w, rev } of chain) {
      const c = rev ? [...w.coords].reverse() : w.coords;
      c.forEach((p, i) => { if (i === 0 && coords.length) return; if (coords.length) attrs.push({ tags: w.tags }); coords.push(p); });
    }
    return { coords, attrs };
  }

  // ---------------------------------------------------------------- words for a way's facts
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const plain = (v) => String(v).replace(/_/g, ' ').replace(/;/g, ', ');
  const BIKES = {
    separate: ['Separate from walkers', '#15803d'], shared: ['Shared with walkers', '#65a30d'], cycleway: ['Cycleway', '#4d7c0f'], lane: ['Cycle lane', '#ca8a04'],
    track: ['Cycle track beside it', '#a16207'], beside: ['Cycleway alongside', '#b45309'], trail: ['On a trail', '#7c2d12'], walk: ['For walkers', '#64748b'], traffic: ['With traffic', '#ea580c'], no: ['No bikes', '#334155'],
  };
  function bikesOf(t) {
    const hw = String(t.highway || '').replace(/_link$/, '');
    if (t.bicycle === 'no' || t.bicycle === 'dismount') return 'no';
    if (hw === 'cycleway' || (['footway', 'path', 'pedestrian'].includes(hw) && t.bicycle === 'designated')) return t.segregated === 'yes' ? 'separate' : t.segregated === 'no' ? 'shared' : 'cycleway';
    const sides = [t.cycleway, t['cycleway:both'], t['cycleway:left'], t['cycleway:right']];
    if (sides.includes('lane') || sides.includes('exclusive')) return 'lane';
    if (sides.includes('track')) return 'track';
    if (sides.includes('separate')) return 'beside';
    if (['path', 'track', 'bridleway'].includes(hw)) return 'trail';
    if (['footway', 'steps', 'pedestrian'].includes(hw)) return 'walk';
    return 'traffic';
  }
  const LIT = { yes: ['Lit', '#facc15'], no: ['Not lit', '#475569'] };
  const litOf = (t) => (t.lit === 'no' ? 'no' : t.lit ? 'yes' : null);
  const SAC_I = { hiking: 0, mountain_hiking: 1, demanding_mountain_hiking: 2, alpine_hiking: 3, demanding_alpine_hiking: 4, difficult_alpine_hiking: 5 };
  const NONE = '#d6dde3';
  const SMOOTH = { excellent: 'Excellent: thin road tyres', good: 'Good: road tyres', intermediate: 'Intermediate: city bikes', bad: 'Bad: sturdy tyres', very_bad: 'Very bad: a mountain bike', horrible: 'Horrible: off-road', very_horrible: 'Very horrible', impassable: 'Impassable' };

  // length by value along the chain: [[value, metres]], the most first (null: not mapped)
  function byLen(chain, fn) {
    const m = new Map();
    for (const { w } of chain) { const v = fn(w.tags); m.set(v, (m.get(v) || 0) + w.len); }
    return [...m].sort((a, b) => b[1] - a[1]);
  }
  // a fact's value: one value, or how much of each; what isn't mapped, said as much
  function valueOf(list, words = plain) {
    const known = list.filter(([v]) => v != null);
    if (!known.length) return null;
    const total = list.reduce((s, [, m]) => s + m, 0), unknown = total - known.reduce((s, [, m]) => s + m, 0);
    const main = known.length === 1 ? words(known[0][0]) : known.map(([v, m]) => `${words(v)} ${fmtDist(m)}`).join(', ');
    return { value: cap(main), note: unknown > 20 ? `Not mapped for ${fmtDist(unknown)} of ${fmtDist(total)}` : '' };
  }

  // ---------------------------------------------------------------- the pick
  // pick: { kind: 'way' | 'area' | 'lipas' | 'point' | 'road', ll, title, line, ... } and its state as it loads
  let pick = null, step = 'none', hold = false, token = 0, routePts = [], routeA = null;
  const worst = () => CFG.data === 'worst', empty = () => CFG.data === 'empty', failing = () => CFG.data === 'fail';
  const LONG = 'Hervannan–Vuoreksen–Hallilan ulkoilureitin yhdysosuus';

  async function chooseWay(w, ll) {
    const j = await join(w);
    const p = { kind: 'way', ll, w, chain: j.chain, branches: j.branches, stops: j.stops, geo: lineOf(j.chain), a: undefined, wx: undefined, places: undefined, ele: undefined };
    p.recorded = j.chain.some((x) => x.w.rec);
    p.tagsAt = empty() ? { highway: w.tags.highway } : w.tags;
    if (empty()) p.chain = p.chain.map((x) => ({ ...x, w: { ...x.w, tags: { highway: x.w.tags.highway } } }));
    p.title = worst() ? LONG : (p.chain.find((x) => x.w.tags.name) || {}).w?.tags.name || KIND_NAME[kindOf(w.tags)] || 'Way';
    p.named = worst() || !!(p.chain.find((x) => x.w.tags.name));
    p.len = p.chain.reduce((s, x) => s + x.w.len, 0);

    return p;
  }
  function wayLine(p) {
    const t = p.chain, bits = [];
    const bikes = byLen(t, bikesOf)[0][0];
    if (bikes && !['trail', 'traffic'].includes(bikes) || kindOf(p.w.tags) === 'road') bits.push(BIKES[bikes][0]);
    const mtb = byLen(t, (x) => (mtbGrade(x) || {}).value || null).find(([v]) => v);
    const sac = byLen(t, (x) => (sacGrade(x) || {}).value || null).find(([v]) => v);
    if (mtb) bits.push(mtb[0]); else if (sac) bits.push(sac[0]);
    const surf = byLen(t, (x) => x.surface || null).find(([v]) => v);
    if (surf) bits.push(plain(surf[0]));
    const wid = byLen(t, (x) => x.width || null).find(([v]) => v);
    if (wid && ['path', 'track', 'cycleway'].includes(kindOf(p.w.tags))) bits.push(`${wid[0]}\u00a0m wide`);
    const lit = byLen(t, litOf).find(([v]) => v);
    if (lit) bits.push(lit[0] === 'yes' ? 'lit' : 'not lit');
    if (worst()) bits.push('faint in places', 'overgrown', 'a ford');
    return bits.length ? cap(bits.join(' · ')) : 'Little is mapped about it';
  }

  // Colour by: the route's own colours (grade, surface), and two new scales (bikes, lit). Only those the way has data for.
  const BY = { grade: 'Grade', surface: 'Surface', bikes: 'Bikes', diff: 'Difficulty', lit: 'Lit' };
  function byModes(p) {
    if (p.kind !== 'way' && p.kind !== 'point') return [];
    const has = (fn) => p.chain.some(({ w }) => fn(w.tags));
    return ['grade', has((t) => t.surface) && 'surface', has((t) => t.bicycle || t.segregated || t.cycleway || t['cycleway:both'] || t['cycleway:left'] || t['cycleway:right'] || kindOf(t) === 'cycleway') && 'bikes',
      has((t) => t['mtb:scale'] || t.sac_scale) && 'diff', has((t) => t.lit) && 'lit'].filter(Boolean);
  }
  let colourBy = (() => { try { return localStorage.getItem('cr-colour') || 'grade'; } catch { return 'grade'; } })();
  const modeFor = (p) => (byModes(p).includes(colourBy) ? colourBy : 'grade');
  function colourFn(p, mode) {
    const a = p.a;
    const tagsAt = (i) => (a.attr[i] && a.attr[i].tags) || {};
    if (mode === 'surface') return (i) => (tagsAt(i).surface ? SURFACE_COLORS[tagsAt(i).surface] || SURFACE_COLORS.unknown : SURFACE_COLORS.unknown);
    if (mode === 'bikes') return (i) => BIKES[bikesOf(tagsAt(i))][1];
    if (mode === 'lit') return (i) => (litOf(tagsAt(i)) ? LIT[litOf(tagsAt(i))][1] : NONE);
    if (mode === 'diff') return (i) => { const t = tagsAt(i), m = parseInt(t['mtb:scale'], 10); return m >= 0 ? DIFF_COLORS[Math.min(6, m)] : SAC_I[t.sac_scale] != null ? DIFF_COLORS[SAC_I[t.sac_scale]] : NONE; };
    return (i) => colorAt(a, i, 'grade');
  }
  function legendOf(p, mode) {
    const a = p.a, fn = colourFn(p, mode), m = new Map();
    const word = (i) => {
      const t = (a.attr[i] && a.attr[i].tags) || {};
      if (mode === 'surface') return t.surface ? plain(t.surface) : 'not mapped';
      if (mode === 'bikes') return BIKES[bikesOf(t)][0].toLowerCase();
      if (mode === 'lit') return litOf(t) ? LIT[litOf(t)][0].toLowerCase() : 'not mapped';
      if (mode === 'diff') return mtbGrade(t) ? `${mtbGrade(t).value} ${mtbGrade(t).word}` : sacGrade(t) ? `${sacGrade(t).value} ${sacGrade(t).word}` : 'not mapped';

      return a.eleGap && a.eleGap[i] ? 'no terrain' : g >= 10 ? 'steep up, 10 % +' : g >= 3 ? 'up, 3–10 %' : g > -3 ? 'flat' : g > -10 ? 'down, 3–10 %' : 'steep down';
    };
    for (let i = 1; i < a.pts.length; i++) { const k = word(i); const e = m.get(k) || { c: fn(i), m: 0 }; e.m += a.along[i] - a.along[i - 1]; m.set(k, e); }
    return [...m].sort((x, y) => y[1].m - x[1].m);
  }
  function drawPick(p) {
    if (!p || CFG.v !== 'new') { setData('cr-pick', EMPTY); setData('cr-branch', EMPTY); setData('cr-area', EMPTY); setData('cr-ring', EMPTY); return; }
    setData('cr-area', p.kind === 'area' && p.geom ? p.geom : EMPTY);
    setData('cr-ring', ['lipas', 'point'].includes(p.kind) && CFG.v === 'new' ? { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: p.at || p.ll } }] } : EMPTY);
    setData('cr-branch', p.branches && p.branches.length ? { type: 'FeatureCollection', features: p.branches.map((w) => ({ type: 'Feature', properties: { color: '#6b7280' }, geometry: { type: 'LineString', coordinates: w.coords } })) } : EMPTY);
    if (p.kind === 'road') { setData('cr-pick', { type: 'FeatureCollection', features: [{ type: 'Feature', properties: { color: '#f59e0b' }, geometry: p.geom }] }); return; }
    if (p.kind !== 'way') { setData('cr-pick', EMPTY); return; }
    if (!p.a || p.a === 'failed') { setData('cr-pick', { type: 'FeatureCollection', features: [{ type: 'Feature', properties: { color: '#374151' }, geometry: { type: 'LineString', coordinates: p.geo.coords } }] }); return; }
    const fn = colourFn(p, modeFor(p)), feats = [];

    for (let i = 1; i < p.a.pts.length; i++) {

      if (!cur || cur.properties.color !== c) { cur = { type: 'Feature', properties: { color: c }, geometry: { type: 'LineString', coordinates: [p.a.pts[i - 1]] } }; feats.push(cur); }
      cur.geometry.coordinates.push(p.a.pts[i]);
    }
    setData('cr-pick', { type: 'FeatureCollection', features: feats });
  }

  // the slower facts: heights (the profile), the weather here now, places at the spot
  function loadMore(p) {
    const my = token, again = () => { if (pick === p && my === token) { drawPick(p); render(); } };
    if (p.kind === 'way') {
      (failing() ? Promise.reject(new Error('terrain')) : analyse(p.geo, { activity: sportOf() }))
        .then((a) => { p.a = a.terrain && a.terrain.all ? 'failed' : a; }, () => { p.a = 'failed'; }).then(again);
    }
    if (p.kind === 'way' || p.kind === 'area' || p.kind === 'lipas') {
      (failing() ? Promise.reject(new Error('weather')) : pointForecasts([p.ll]).then(([s]) => sampleAt(s, Date.now() / 1000)))
        .then((w) => { p.wx = w; }, () => { p.wx = 'failed'; }).then(again);
    }
    if (p.kind === 'way' || p.kind === 'area') {
      const types = Object.keys(LIPAS_TYPES).map(Number).filter((t) => t < 4000);
      (failing() ? Promise.reject(new Error('lipas')) : worst() ? Promise.resolve(Array.from({ length: 6 }, (_, i) => ({ type: 1520, id: i, name: `${['Kaupin', 'Hervannan', 'Niihaman', 'Kalevan', 'Tammelan', 'Pyynikin'][i]} ulkoilualueen laavu ja tulentekopaikka`, at: p.ll })))
        : lipasNear(p.ll, 0.12, types)).then((list) => { p.places = list.slice(0, 8); }, () => { p.places = 'failed'; }).then(again);

  }

  // ---------------------------------------------------------------- what a tap picks
  async function pickAt(ll, pt, { touch = touchy() } = {}) {
    const box = hitBox(pt, touch);
    // the map's own things first: road works, LIPAS, the route's points
    const rw = map.queryRenderedFeatures(box, { layers: ['sf-lines', 'sf-points'].filter((id) => map.getLayer(id)) }).find((f) => f.properties.kind === 'roadwork');
    if (rw) return roadPick(rw.properties, ll);
    const near = routePts.findIndex((q) => { const s = map.project(q); return Math.hypot(s.x - pt.x, s.y - pt.y) < (touch ? 22 : 12); });
    if (near >= 0) return pointPick(near);
    if (lipasPicks.length) { const lp = lipasPicks.find((x) => { const s = map.project(x.at); return Math.hypot(s.x - pt.x, s.y - pt.y) < (touch ? 22 : 12); }); if (lp) return lipasPick(lp); }
    await loadTile(tileOf(ll)).catch(() => null);
    const w = nearestWay(ll, touch ? 18 : 9);
    if (w) return chooseWay(w, ll);
    return areaPick(ll, pt);
  }

  // an area: its outline from OpenStreetMap (the smallest named water, park or nature area around the spot)
  async function areaPick(ll, pt) {
    const water = map.getLayer('water') && map.queryRenderedFeatures(pt, { layers: ['water'] }).length;
    const key = `cr-isin/${ll[1].toFixed(4)}/${ll[0].toFixed(4)}`;
    const qy = `[out:json][timeout:25];is_in(${ll[1]},${ll[0]})->.a;(way(pivot.a)[~"^(natural|leisure|landuse|water|boundary)$"~"^(water|park|nature_reserve|forest|wood|recreation_ground|protected_area)$"];rel(pivot.a)[~"^(natural|leisure|landuse|water)$"~"^(water|park|nature_reserve|forest|wood|recreation_ground)$"];);out body geom qt;`;
    const p = { kind: 'area', ll, title: water ? 'Water' : 'This spot', line: '', tags: {}, geom: null, wx: undefined, places: undefined, ele: undefined };
    try {
      const json = failing() ? await Promise.reject(new Error('Overpass')) : await (q.has('rec') ? Promise.reject(new Error('recording')) : cachedOverpass(key, qy, (j) => j, { race: true }))
        .catch(async (err) => { const d = await recorded(); const near = Object.entries(d.areas || {}).find(([k2]) => { const [la, lo] = k2.split('/').map(Number); return Math.abs(la - ll[1]) < 0.004 && Math.abs(lo - ll[0]) < 0.008; }); if (!near) throw err; p.recorded = true; return near[1]; });
      const els = (json.elements || []).filter((e) => e.tags && (e.geometry || e.members));
      const size = (e) => { const g = e.geometry || (e.members || []).flatMap((m) => m.geometry || []); let s = Infinity, n = -Infinity, w = Infinity, ea = -Infinity; for (const q of g) { if (!q) continue; s = Math.min(s, q.lat); n = Math.max(n, q.lat); w = Math.min(w, q.lon); ea = Math.max(ea, q.lon); } return (n - s) * (ea - w); };
      const best = els.filter((e) => e.tags.name).sort((a, b) => size(a) - size(b))[0] || els.sort((a, b) => size(a) - size(b))[0];
      if (best) {
        const t = best.tags;
        p.tags = t;
        p.title = worst() ? LONG : t.name || (t.natural === 'water' ? 'Water' : cap(plain(t.leisure || t.landuse || t.natural)));
        p.line = cap([t.natural === 'water' ? (t.water ? plain(t.water) : 'water') : plain(t.leisure || t.landuse || t.natural || ''), t.access === 'private' ? 'private' : ''].filter(Boolean).join(' · '));
        const lines = best.geometry ? [best.geometry.map((q) => [q.lon, q.lat])] : best.members.filter((m) => m.geometry).map((m) => m.geometry.filter(Boolean).map((q) => [q.lon, q.lat]));

        p.outline = lines;
      }
    } catch { p.failed = true; }
    return p;
  }

  // LIPAS places near a scene's spot (its map icons are the app's own layer; here, the scene's places)
  let lipasPicks = [];
  function lipasPick(x) {
    const t = LIPAS_TYPES[x.type] || {};
    return { kind: 'lipas', ll: x.at, at: x.at, title: worst() ? LONG : x.name, line: [t.name, 'from LIPAS'].filter(Boolean).join(' · '), lipas: x, wx: undefined, ele: undefined };
  }

  // a point on the recorded route (tools/fixtures/route-kauppi-mtb.json): no routing
  async function loadRoute() {
    if (routeA) return;
    const fx = await (await request('polku', new URL('../../../tools/fixtures/route-kauppi-mtb.json', location.href).href)).json();
    const coords = [], attrs = [];
    for (const leg of fx.legs) leg.result.coords.forEach((c, i) => { if (i === 0 && coords.length) return; if (coords.length) attrs.push({ tags: leg.result.tags[Math.min(i - 1, leg.result.tags.length - 1)] || {} }); coords.push(c); });
    routePts = fx.points.map((q) => coords.reduce((b, c) => (dist(c, q) < dist(b, q) ? c : b))); // (a point is drawn where the route reaches it)
    routeA = await analyse({ coords, attrs }, { activity: 'mtb' }).catch(() => 'failed');
    setData('cr-route', { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } }] });
    routeMarkers();
  }
  let routeMks = [];
  function routeMarkers() {
    routeMks.forEach((m) => m.remove());
    routeMks = routePts.map((ll, i) => new maplibregl.Marker({ element: h('div', { class: `wp${i === 0 ? ' wp-start' : i === routePts.length - 1 ? ' wp-end' : ''}` }, i === 0 || i === routePts.length - 1 ? '' : String(i)) }).setLngLat(ll).addTo(map));
  }
  function pointPick(i) {
    const ll = routePts[i], a = routeA;
    const at = a && a !== 'failed' ? a.pts.reduce((b, q, k) => (dist(q, ll) < dist(a.pts[b], ll) ? k : b), 0) : 0;
    return { kind: 'point', ll, at: ll, i, idx: at, title: i === 0 ? 'Start' : i === routePts.length - 1 ? 'End' : `Point ${i}`, a, chain: [], wx: undefined };
  }

  // road works from Fintraffic, as the app asks for them (js/safety.js): the nearest to the scene
  let roadworks = null;
  async function loadRoadworks(ll) {
    if (roadworks) return roadworks;
    const [x, y] = lonLatToTile(ll[0], ll[1], 8).map(Math.floor), [w, s, e, n] = tileBounds(x, y, 8);
    const res = await request('digitraffic', `https://tie.digitraffic.fi/api/traffic-message/v2/roadworks?xMin=${w}&xMax=${e}&yMin=${s}&yMax=${n}`, { headers: { 'Digitraffic-User': 'Polku/1.0 (polku.si)' } });

      const p = f.properties || {}, a = (p.announcements || [])[0] || {}, t = a.timeAndDuration || {};

    map.getSource('sfLines')?.setData(ctx.data.sfLines);

    ctx.data.sfPoints = pts; map.getSource('sfPoints')?.setData(pts);
    return roadworks;
  }
  function roadPick(props, ll) {
    const f = (roadworks || []).find((x) => x.properties.id === props.id) || { properties: props, geometry: { type: 'Point', coordinates: ll } };
    return { kind: 'road', ll, props: f.properties, geom: f.geometry, title: 'Road works', line: worst() ? f.properties.where : f.properties.title };
  }

  // ---------------------------------------------------------------- the card (New): one card for every kind of thing
  const fmtWhen = (iso) => (iso ? new Date(iso).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '');
  const factRows = (list) => h('div', { class: 'cr-facts' }, ...list.filter(Boolean).map(([k, v, note]) => h('div', { class: 'insp-row' }, h('span', {}, k), h('b', {}, v), note ? h('small', {}, note) : null)));
  const group = (title, list) => { const kept = list.filter(Boolean); return kept.length ? [h('h4', { class: 'menu-h' }, title), factRows(kept)] : []; };
  const shownHere = (k, opened) => { const at = choiceOf(k); return at === 'c' || (at === 'm' && opened === 'hold'); };
  const kindHas = (b, p) => b.on === 'all' || b.on.split(' ').includes(p.kind);

  function profileSvg(p, upTo = null) {
    const a = p.a, W = 300, H = 60, n = a.pts.length;
    const lo = a.minE, hi = Math.max(a.maxE, a.minE + 10), total = a.along[n - 1] || 1;
    const X = (i) => (a.along[i] / total) * W, Y = (i) => H - 4 - ((a.ele[i] - lo) / (hi - lo)) * (H - 10);
    const fn = colourFn(p, modeFor(p));
    let paths = '';
    let start = 1;
    for (let i = 1; i <= n; i++) {
      const c = i < n ? fn(i) : null;
      if (i === n || c !== fn(start)) {
        let d = `M${X(start - 1).toFixed(1)},${H} `;
        for (let k = start - 1; k < i; k++) d += `L${X(k).toFixed(1)},${Y(k).toFixed(1)} `;
        d += `L${X(i - 1).toFixed(1)},${H}Z`;
        const faded = upTo != null && start - 1 >= upTo;
        paths += `<path d="${d}" fill="${faded ? '#cbd5e1' : fn(start)}" opacity="${faded ? 0.55 : 0.92}"/>`;
        start = i;
      }
    }

    for (let k = 0; k < n; k++) ink += `${k ? 'L' : 'M'}${X(k).toFixed(1)},${Y(k).toFixed(1)} `;

    const sx = X(spot).toFixed(1);

    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${paths}<path d="${ink}" fill="none" stroke="var(--chart-ink)" stroke-width="1.4" vector-effect="non-scaling-stroke"/><line x1="${sx}" x2="${sx}" y1="0" y2="${H}" stroke="var(--chart-ink)" stroke-width="1.5" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/></svg><span class="ax top">${Math.round(a.maxE)} m</span><span class="ax bot">${Math.round(a.minE)} m</span>`;
    return box;
  }
  function colourChips(p) {
    const modes = byModes(p), cur = modeFor(p);
    const chips = h('div', { class: 'way-chips cr-by', role: 'group', 'aria-label': 'Colour by' }, ...modes.map((k) => h('button', {
      type: 'button', class: 'chip', 'aria-pressed': String(k === cur), html: `${k === cur ? icon('check', 15) : ''}<span>${BY[k]}</span>`,
      onclick: () => { colourBy = k; try { localStorage.setItem('cr-colour', k); } catch { /* storage blocked */ } drawPick(p); render(); },
    })));
    const legend = h('div', { class: 'cr-legend' }, ...legendOf(p, cur).slice(0, 6).map(([w, { c, m }]) => h('span', { html: `<i class="dot" style="background:${c}"></i>${w} ${fmtDist(m)}` })));
    return [chips, legend];
  }
  function weatherGroup(p) {
    if (p.wx === undefined) return group('Weather here now', [['Weather', '…']]);
    if (p.wx === 'failed') return [h('h4', { class: 'menu-h' }, 'Weather here now'), h('p', { class: 'cr-fail' }, 'The forecast didn’t load. ', h('button', { type: 'button', class: 'btn quiet', onclick: () => { p.wx = undefined; render(); loadMore(p); } }, 'Try again'))];
    const w = p.wx;
    return group('Weather here now', [
      ['Wind', `${w.speed.toFixed(0)} m/s from the ${compass(w.dir)}`, `Gusts ${w.gust.toFixed(0)} m/s`],
      ['Rain', w.precip >= 0.1 ? `${w.precip.toFixed(1)} mm an hour${w.temp < 0.5 ? ', snow' : ''}` : 'Dry'],
      ['Temperature', `${w.temp.toFixed(0)} °C`, 'Open-Meteo’s forecast for its 3 km square'],
    ]);
  }
  function placesGroup(p) {

    const at = p.kind === 'notright' ? p.from.ll : p.ll;
    if (p.kind === 'point' && isNew) { pinMk?.remove(); pinMk = null; } else if (!pinMk) pinMk = new maplibregl.Marker({ element: h('span', { class: 'card-pin' }) }).setLngLat(at).addTo(map); else pinMk.setLngLat(at);
    const title = isNew ? p.title : (p.today || {}).title || p.title;
    // the line at the spot, on a phone, browsing (New): the hover's words, a button that opens the card
    if (isNew && !wide() && step === 'line') {
      const el = h('button', { type: 'button', class: 'cr-line', 'aria-label': `${title}. Open its card`, onclick: (e) => { e.stopPropagation(); open(p, 'card'); } },
        h('span', {}, h('b', {}, title), p.line ? h('small', {}, p.line) : null), h('span', { html: icon('chevronUp', 18) }));
      for (const ev of ['mousedown', 'touchstart', 'pointerdown', 'click', 'dblclick']) el.addEventListener(ev, (e) => e.stopPropagation());
      lineMk?.remove();
      lineMk = new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -16] }).setLngLat(at).addTo(map);
      popup?.remove(); popup = null;
      if (sheet) { const s = sheet; sheet = null; s.classList.add('leaving', 'entering'); setTimeout(() => s.remove(), 200); }
      return;
    }
    lineMk?.remove(); lineMk = null;
    const card = isNew ? buildCard(p) : todayCard(p);
    const inPeek = !wide() && (isNew || (modeOf() === 'edit' && opened === 'hold') || p.kind === 'point');
    if (inPeek) {
      popup?.remove(); popup = null;
      const fresh = !sheet;
      if (fresh) {
        sheet = h('div', { class: 'cr-sheet entering', 'data-step': step === 'full' ? 'full' : 'card', role: 'dialog', 'aria-label': title });
        document.body.append(sheet);
      }
      const handle = h('button', { type: 'button', class: 'sheet-handle', 'aria-label': step === 'full' ? 'Show less of the card' : 'Show all of the card', onclick: () => { step = step === 'full' ? 'card' : 'full'; size(); } });
      sheet.replaceChildren(handle, card);
      dragSheet(handle);
      size();
      if (fresh) requestAnimationFrame(() => requestAnimationFrame(() => sheet && sheet.classList.remove('entering')));
    } else {
      if (sheet) { const s = sheet; sheet = null; s.remove(); }
      const box = h('div', {}, card);
      if (!popup) {
        popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, focusAfterOpen: false, maxWidth: 'none', anchor: anchorFor(at), className: `polku-popup card-float${isNew ? ' cr-card' : ''}`, offset: 14 }).setLngLat(at).setDOMContent(box).addTo(map);
      } else popup.setDOMContent(box);
      box.firstChild.style.setProperty('--card-max', `${Math.max(240, innerHeight - 100)}px`);
      requestAnimationFrame(keepInView);
    }
  }
  // the float in view: the map moves under it (js/inspect.js's keepInView())
  function keepInView() {
    if (!popup) return;
    const r = popup.getElement().getBoundingClientRect(), m = 8, top = 64;
    const dx = r.left < m ? r.left - m : r.right > innerWidth - m ? Math.min(r.right - (innerWidth - m), r.left - m) : 0;
    const dy = r.top < top ? r.top - top : r.bottom > innerHeight - m ? Math.min(r.bottom - (innerHeight - m), r.top - top) : 0;
    if (dx || dy) map.panBy([dx, dy], { duration: 0 });
  }
  function anchorFor(ll) {
    const s = map.project(ll), right = innerWidth - s.x > Math.min(350, s.x), down = innerHeight - s.y > Math.min(480, innerHeight * 0.55);
    return `${down ? 'top' : 'bottom'}-${right ? 'left' : 'right'}`;
  }
  // the sheet's heights: the card (its head, numbers, profile and Colour by), or all of it (full at most)
  function size() {
    if (!sheet) return;
    sheet.dataset.step = step === 'full' ? 'full' : 'card';
    const card = sheet.querySelector('.pl-way');
    const upto = card.querySelector('[data-stop]');
    const all = card.offsetTop + card.scrollHeight + 4;
    // the card never goes under the bar, however tall the bar is (two rows at 200 %)
    const top = Math.round((document.querySelector('.cr-bar')?.getBoundingClientRect().bottom || 56) + 8);
    sheet.style.setProperty('--cr-top', `${top}px`);
    const max = innerHeight - top - 8;
    const part = upto ? upto.offsetTop + 2 : all;
    const hgt = step === 'full' ? Math.min(all, max) : Math.min(part, all, max * 0.62);
    sheet.style.setProperty('--cr-h', `${Math.round(hgt)}px`);
  }
  function dragSheet(handle) {
    let y0 = null, h0 = 0, t0 = 0;
    const down = (e) => { if (y0 != null) return; y0 = e.clientY; t0 = e.timeStamp; h0 = sheet.offsetHeight; sheet.classList.add('dragging'); handle.setPointerCapture?.(e.pointerId); };
    const move = (e) => { if (y0 == null || !sheet) return; sheet.style.setProperty('--cr-h', `${Math.max(80, h0 - (e.clientY - y0))}px`); };
    const up = (e) => {
      if (y0 == null || !sheet) return;
      const dy = e.clientY - y0, fast = Math.abs(dy) / Math.max(1, e.timeStamp - t0) > 0.11; y0 = null; sheet.classList.remove('dragging');
      if (Math.abs(dy) < 6) return; // a tap: the button's own click
      if (dy < -30 || (fast && dy < 0)) step = 'full'; else if (dy > 30 || fast) { if (step === 'full') step = 'card'; else { step = 'line'; render(); return; } }
      size();
    };
    handle.addEventListener('pointerdown', down); handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
  }
  const toast = (msg) => { const t = h('div', { class: 'cr-status cr-toast', role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), 2200); };

  // ---------------------------------------------------------------- taps, holds and the hover
  const post = (msg) => { if (FRAME && parent !== self) parent.postMessage(msg, location.origin); };
  let points = [];
  async function onTap(ll, pt, how, { echo = true } = {}) {
    if (echo) post({ cr: 'tap', ll, how });
    // editing: a tap does the main action, adds a point
    if (modeOf() === 'edit' && how === 'tap') {
      close();
      const mk = new maplibregl.Marker({ element: h('div', { class: 'wp' }, String(points.length + 1)) }).setLngLat(ll).addTo(map);
      points.push(mk);
      return;
    }
    opened = how;
    const my = ++token;
    const p = await pickAt(ll, pt);
    if (!p || my !== token) return;
    if (p.kind === 'way') token = my; // (chooseWay counted one)
    p.ll = p.ll || ll;
    todayOf(p, pt);
    loadMore(p);
    if (p.kind === 'point') p.a = routeA;
    open(p, how === 'hold' || wide() || CFG.v === 'today' ? 'card' : 'line');
  }
  map.on('click', (e) => { if (held) { held = false; return; } onTap([e.lngLat.lng, e.lngLat.lat], e.point, 'tap'); });
  map.on('contextmenu', (e) => { e.preventDefault?.(); onTap([e.lngLat.lng, e.lngLat.lat], e.point, 'hold'); });
  // a hold: the ring from 150 ms, the card at 500 ms within 10 px (js/gestures.js's bindHold)
  let held = false, holdT = 0, ringT = 0, ring = null, start = null;
  const canvas = map.getCanvasContainer();
  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    start = { x: e.clientX, y: e.clientY };
    clearTimeout(holdT); clearTimeout(ringT);
    ringT = setTimeout(() => { ring = h('div', { class: 'hold-ring', style: `left:${start.x}px;top:${start.y}px` }); document.body.append(ring); }, 150);
    holdT = setTimeout(() => {
      ring?.remove(); ring = null; held = true;
      const r = canvas.getBoundingClientRect(), pt = new maplibregl.Point(start.x - r.left, start.y - r.top), ll = map.unproject(pt);
      onTap([ll.lng, ll.lat], pt, 'hold');
    }, 500);
  });
  const cancelHold = () => { clearTimeout(holdT); clearTimeout(ringT); ring?.remove(); ring = null; };
  canvas.addEventListener('pointermove', (e) => { if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 10) cancelHold(); });
  canvas.addEventListener('pointerup', cancelHold); canvas.addEventListener('pointercancel', cancelHold);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  // the desktop's hover: the same line, at the pointer, and the way it's over drawn plain
  let hoverT = 0;
  map.on('mousemove', (e) => {
    if (!wide() || CFG.v !== 'new' || !matchMedia('(hover: hover)').matches) return;
    clearTimeout(hoverT);
    tip?.setAttribute('hidden', '');
    hoverT = setTimeout(async () => {
      const ll = [e.lngLat.lng, e.lngLat.lat];
      const w = nearestWay(ll, 9);
      if (!w) { if (!pick) drawPick(null); tip?.setAttribute('hidden', ''); return; }
      const j = walk(w), p = { kind: 'way', w, chain: j.chain, branches: [], geo: lineOf(j.chain), ll };
      p.title = (j.chain.find((x) => x.w.tags.name) || {}).w?.tags.name || KIND_NAME[kindOf(w.tags)];
      if (worst()) p.title = LONG;
      p.line = wayLine(p);
      if (!pick) drawPick({ ...p, a: null });
      if (!tip) { tip = h('div', { class: 'hover-tip cr-tip', 'aria-hidden': 'true' }); document.body.append(tip); }
      tip.innerHTML = `<b></b><span></span>`;
      tip.querySelector('b').textContent = p.title; tip.querySelector('span').textContent = `${p.line} · click for its card`;
      const r = map.getContainer().getBoundingClientRect();
      tip.style.transform = `translate(${Math.min(r.left + e.point.x + 14, innerWidth - 270)}px, ${r.top + e.point.y + 16}px)`;
      tip.removeAttribute('hidden');
    }, 120);
  });
  map.getCanvas().addEventListener('mouseleave', () => { clearTimeout(hoverT); tip?.setAttribute('hidden', ''); if (!pick) drawPick(null); });
  map.on('movestart', () => tip?.setAttribute('hidden', ''));
  // the hover needs the ways in view: the tile in the map's middle, once it's close enough
  map.on('moveend', () => { if (map.getZoom() >= 14) { const c = map.getCenter(); loadTile(tileOf([c.lng, c.lat])).catch(() => null); } });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && pick) close({ echo: true }); });

  // ---------------------------------------------------------------- scenes
  async function applyScene() {
    const sc = sceneOf(CFG.scene);
    close();
    points.forEach((m) => m.remove()); points = [];
    restyle();
    setData('cr-route', EMPTY); routeMks.forEach((m) => m.remove()); routeMks = []; routePts = []; lipasPicks = [];
    map.jumpTo({ center: sc.at, zoom: sc.z });
    status(`Loading: ${sc.title}…`);
    try {
      let ll = sc.at;
      if (sc.way) {
        await loadTile(tileOf(sc.at));
        const w = ways.get(sc.way);
        if (w) { const i = Math.max(1, Math.floor(w.coords.length / 2)); const a = w.coords[i - 1], b = w.coords[i]; ll = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
      }
      if (sc.point != null) { await loadRoute(); ll = routePts[sc.point]; }
      if (sc.lipas) {
        const types = Object.keys(LIPAS_TYPES).map(Number).filter((t) => t < 4000);
        const list = failing() ? [] : await lipasNear(sc.at, 0.5, types).catch(() => []);
        lipasPicks = list.filter((x) => x.at && x.name);
        const x = lipasPicks.sort((p1, p2) => dist(p1.at, sc.at) - dist(p2.at, sc.at))[0];
        if (!x) { status('LIPAS didn’t answer, so there’s no place to show here. Try again in a minute.'); return; }
        ll = x.at;
        setData('cr-ring', EMPTY);
      }
      if (sc.road) {
        const list = failing() ? [] : await loadRoadworks(sc.at).catch(() => []);
        const near = list.map((f) => { const g = f.geometry, c = g.type === 'Point' ? [g.coordinates] : g.type === 'LineString' ? g.coordinates : g.coordinates.flat(); return { f, c: c[Math.floor(c.length / 2)] }; })
          .sort((x1, x2) => dist(x1.c, sc.at) - dist(x2.c, sc.at))[0];
        if (!near) { status('Fintraffic has no road works here now, or didn’t answer.'); return; }
        ll = near.c; map.jumpTo({ center: ll, zoom: 15 });
        await settled();
      }
      map.jumpTo({ center: ll, zoom: sc.z });
      await settled();
      status('');
      const pt = map.project(ll);
      opened = sc.mode === 'edit' || modeOf() === 'edit' ? 'hold' : 'tap';
      await onTap(ll, pt, opened, { echo: false });
      // a scene opens at its card (the card's heights scene at the line, to show the steps)
      if (pick && sc.step !== 'line' && step === 'line') open(pick, 'card');
    } catch (err) {
      status(`Didn’t load: ${err.message || err}. Overpass may be busy: try again in a minute.`);
    }
  }
  // the map drawn at the scene, or 4 s gone (a slow network, or a page in the background, never draws)
  const settled = () => new Promise((ok) => { if (map.loaded()) { ok(); return; } map.once('idle', ok); setTimeout(ok, 4000); });
  // a line under the bar while a scene loads
  let statusEl = null;
  function status(text) {
    if (!statusEl) { statusEl = h('div', { class: 'cr-status', role: 'status' }); document.body.append(statusEl); }
    statusEl.textContent = text; statusEl.hidden = !text;
  }

  // ---------------------------------------------------------------- the bar and its panel (a phone, or a narrow window)
  if (!FRAME) {
    const bar = h('div', { class: 'cr-bar' });
    const drawBar = () => {
      bar.replaceChildren(h('button', { type: 'button', class: 'btn cr-scene-btn', html: icon('chevronDown', 16), 'aria-haspopup': 'dialog', onclick: openPanel }, h('span', {}, sceneOf(CFG.scene).title)),
        seg('Show', CFG.v, { today: 'Today', new: 'New' }, (v) => { CFG.v = v; changed('v'); }));
      bar.lastChild.classList.remove('full');
    };
    document.body.append(bar);
    drawBar();
    let panel = null, scrim = null;
    function openPanel() {
      scrim = h('div', { class: 'cr-scrim', onclick: closePanel });
      panel = h('div', { class: 'cr-sheetpanel cr-panel', role: 'dialog', 'aria-label': 'The mock-up' });
      document.body.append(scrim, panel);
      renderPanel(panel, onPanel);
      panel.querySelector('button')?.focus();
    }
    function closePanel() { panel?.remove(); scrim?.remove(); panel = scrim = null; }
    const changed = (what) => { history.replaceState(null, '', `?${writeUrl()}`); drawBar(); apply(what); };
    function onPanel(what) { changed(what); if (what === 'scene') closePanel(); else if (panel) renderPanel(panel, onPanel); }
  } else {
    addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.cr === 'cfg') { const was = { ...CFG }; Object.assign(CFG, e.data.cfg); const what = was.scene !== CFG.scene ? 'scene' : was.mode !== CFG.mode ? 'mode' : was.sport !== CFG.sport ? 'sport' : was.fork !== CFG.fork ? 'fork' : was.data !== CFG.data ? 'data' : was.b !== CFG.b ? 'b' : 'v'; if (booted) apply(what); }
      if (e.data.cr === 'tap') { if (e.data.close) { close(); return; } const pt = map.project(e.data.ll); onTap(e.data.ll, pt, e.data.how, { echo: false }); }
    });
  }
  function apply(what) {
    if (what === 'b' || what === 'v') { if (pick) { drawPick(CFG.v === 'new' ? pick : null); render(); } return; }
    applyScene();
  }
  // for scripted checks: go to a scene, and read the pick
  Object.defineProperties(window.cr, { go: { value: (id, more = {}) => { Object.assign(CFG, { scene: id, mode: '', sport: '' }, more); return applyScene(); } }, pick: { get: () => pick }, step: { get: () => step } });
  let booted = false;
  function ready() {
    booted = true;
    post({ cr: 'ready' });
    applyScene();
  }
}
</script>
</body>
