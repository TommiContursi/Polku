<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Polku — trail map</title>
  <meta name="description" content="Trail map for mountain biking, gravel, hiking and paddling in Finland, with uphill difficulty and open-water route planning.">
  <meta name="theme-color" content="#1f6f4a">
  <script>
    // Light or dark, and more contrast, before the first paint, as applyTheme() in js/main.js decides them (#323, #547)
    {
      let s = {};
      try { s = JSON.parse(localStorage.getItem('polku:settings')) || {}; } catch { /* private mode */ }
      const a = s.appearance, dark = a === 'light' || a === 'dark' ? a === 'dark'
        : a === 'map' ? ['aerial', 'ortofi', 'night'].includes(s.base) : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.contrast = s.highContrast || matchMedia('(prefers-contrast: more)').matches ? 'more' : 'normal';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#181c1a' : '#1f6f4a';
    }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f4a'/%3E%3Cpath d='M6 24c4-1 5-6 9-7s6 2 11-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-dasharray='4 3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="map" role="region" aria-label="Map"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Polku home">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1f6f4a"/><path d="M6 24c4-1 5-6 9-7s6 2 11-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/></svg>
      <span>Polku</span>
    </a>
    <div class="search" role="combobox" aria-expanded="false" aria-owns="search-results" aria-haspopup="listbox">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="search-input" type="search" placeholder="Search places or paste coordinates" autocomplete="off" aria-label="Search places">
      <kbd>/</kbd>
      <!-- desktop: plan from the search bar; the planner opens as a side panel right below -->
      <button id="btn-plan-search" class="search-plan" type="button" aria-expanded="false" aria-controls="planner" title="Plan a route (R)">
        <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/></svg>
        <span>Plan</span>
      </button>
      <ul id="search-results" role="listbox" hidden></ul>
    </div>
    <!-- the active sport as a pill; hover (desktop) or tap opens the others -->
    <div id="activity-bar" class="act-pill"></div>
    <button id="btn-settings" class="top-btn" type="button" data-panel="settings-panel" aria-pressed="false" title="Settings: sport, planner, display, offline maps, data sources" aria-label="Settings">
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </header>
  <button id="zoom-hint" class="zoom-hint" type="button" hidden>Zoom in to see every trail</button>

  <!-- Map controls, bottom right at every screen size, in one order, top to bottom:
       how you look at the map (compass, locate, zoom, 3D), what it shows (Weather,
       Layers), then Plan — the most used ones nearest the thumb.
       On phones they ride above the planner sheet; on desktop it leaves them room. -->
  <div id="map-ctrls" class="map-ctrls">
    <div class="ctrl-compass"></div>
    <button id="btn-locate" class="ctrl-btn fab-locate" type="button" aria-pressed="false" title="Show my location" aria-label="Show my location">
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <!-- Show the whole route (25a): with a route on the map; a desktop's toolbar has it while planning -->
    <button id="btn-fit" class="ctrl-btn" type="button" title="Show the whole route (F)" aria-label="Show the whole route" aria-keyshortcuts="F" hidden></button>
    <div class="ctrl-zoom" role="group" aria-label="Zoom">
      <button id="btn-zoom-in" class="ctrl-btn" type="button" title="Zoom in" aria-label="Zoom in"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="btn-zoom-out" class="ctrl-btn" type="button" title="Zoom out" aria-label="Zoom out"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    </div>
    <!-- 3D terrain (#226): the same switch as in Layers; pressed while it's on -->
    <button id="btn-3d" class="ctrl-btn ctrl-3d" type="button" aria-pressed="false" title="3D terrain" aria-label="3D terrain"><span aria-hidden="true">3D</span></button>
    <button id="btn-time" class="fab" type="button" aria-pressed="false" aria-label="Time & weather" title="Time & weather (T)">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.44 13.77A6 6 0 1 1 14.62 7.35"/><path d="M8.8 5.4v3.4H6.4"/><path d="M10.6 21a3.6 3.6 0 0 1-.13-7.2 4.6 4.6 0 0 1 9.13.8 3.2 3.2 0 0 1 0 6.4Z"/></svg>
      <span class="fab-time-label">Weather</span>
    </button>
    <button id="btn-layers" class="fab fab-layers" type="button" data-panel="quick-layers" aria-controls="quick-layers" aria-expanded="false" title="Layers: base map, trails, weather, traffic… (L)">
      <img class="fab-thumb" src="img/base/trail.jpg" alt="" width="56" height="56">
      <span>Layers</span>
    </button>
    <!-- Plan: last in the column (a fab on desktop, a pill on phones); it stays while planning, pressed -->
    <button id="btn-plan" class="plan-btn" type="button" aria-expanded="false" aria-controls="planner" title="Plan a route (R)">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/></svg>
      <span>Plan<span class="plan-more"> route</span></span>
    </button>
  </div>


  <div id="view3d" class="view3d" hidden aria-label="3D view controls"></div>
  <div id="wx-bar" class="wx-bar" hidden role="region" aria-label="Timeline"></div>

  <!-- the quick layer drawer (#123): Layers opens it; More, the full panel below. A sheet on phones
       (over a scrim that closes it), a card beside the button on desktop. js/main.js renders it. -->
  <div id="quick-scrim" class="qd-scrim" hidden></div>
  <div id="quick-layers" class="qd" role="dialog" aria-label="Map layers" aria-modal="false" lang="en"></div>

  <aside id="layers-panel" class="panel" hidden aria-label="All map layers">
    <div class="qd-grab" aria-hidden="true"></div>
    <div class="panel-head"><button class="panel-back tool" type="button" aria-label="Back to quick layers"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><h2>All layers</h2><button class="panel-close tool" type="button" aria-label="Close"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="layers-body" class="panel-body"></div>
  </aside>

  <aside id="settings-panel" class="panel panel-settings" hidden aria-label="Settings">
    <div class="panel-head"><h2>Settings</h2><button class="panel-close tool" type="button" aria-label="Close"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="settings-body" class="panel-body"></div>
  </aside>

  <section id="planner" class="sheet" hidden aria-label="Route planner"></section>
  <!-- the planner's toolbox: floating above the sheet on phones (or docked into it), on the panel's edge on desktops (25a) -->
  <div id="pl-tools" class="pl-tools" role="toolbar" aria-label="Drawing tools" aria-controls="planner" hidden></div>
  <div id="track-card" class="track-card" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div class="drop-hint" aria-hidden="true"><span>Drop a GPX or KML file</span></div>
  <input id="file-input" type="file" accept=".gpx,.kml,application/gpx+xml,application/vnd.google-earth.kml+xml" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
