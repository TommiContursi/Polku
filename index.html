<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Polku — trail map</title>
  <meta name="description" content="Trail map for mountain biking, gravel, hiking and paddling in Finland, with uphill difficulty and open-water route planning.">
  <meta name="theme-color" content="#1f6f4a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f4a'/%3E%3Cpath d='M6 24c4-1 5-6 9-7s6 2 11-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-dasharray='4 3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js"></script>
</head>
<body>
  <div id="map" role="region" aria-label="Map"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Polku home">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1f6f4a"/><path d="M6 24c4-1 5-6 9-7s6 2 11-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/></svg>
      <span>Polku</span>
    </a>
    <div class="search" role="combobox" aria-expanded="false" aria-owns="search-results" aria-haspopup="listbox">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="search-input" type="search" placeholder="Search places or paste coordinates" autocomplete="off" aria-label="Search places">
      <kbd>/</kbd>
      <ul id="search-results" role="listbox" hidden></ul>
    </div>
  </header>

  <nav id="activity-bar" class="activity-bar" aria-label="Activity"></nav>
  <button id="zoom-hint" class="zoom-hint" type="button" hidden>Zoom in to see every trail</button>

  <div class="fab-col">
    <button id="btn-plan" class="fab primary" type="button" aria-pressed="false" title="Plan a route (R)">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/></svg>
      <span>Plan</span>
    </button>
    <button class="fab" type="button" data-panel="layers-panel" aria-pressed="false" title="Map layers (L)">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/><path d="m2 18 10 5 10-5" opacity=".55"/></svg>
      <span>Layers</span>
    </button>
    <button class="fab" type="button" data-panel="legend-panel" aria-pressed="false" title="Legend">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h10M10 18h10"/></svg>
      <span>Legend</span>
    </button>
    <button id="btn-3d" class="fab" type="button" aria-pressed="false" title="3D terrain">
      <span class="fab-3d">3D</span>
      <span>Terrain</span>
    </button>
  </div>

  <aside id="layers-panel" class="panel" hidden aria-label="Map layers">
    <div class="panel-head"><h2>Map layers</h2><button class="panel-close tool" type="button" aria-label="Close"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="layers-body" class="panel-body"></div>
  </aside>

  <aside id="legend-panel" class="panel" hidden aria-label="Legend">
    <div class="panel-head"><h2>Legend</h2><button class="panel-close tool" type="button" aria-label="Close"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="legend-body" class="panel-body"></div>
  </aside>

  <section id="planner" class="sheet" hidden aria-label="Route planner"></section>
  <div id="track-card" class="track-card" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div class="drop-hint" aria-hidden="true">Drop a GPX or KML file</div>
  <input id="file-input" type="file" accept=".gpx,.kml,application/gpx+xml,application/vnd.google-earth.kml+xml" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
