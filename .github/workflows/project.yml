name: Project progress

on:
  issues:
    types: [opened, edited, closed, reopened, transferred, milestoned, demilestoned]
  # Metadata only. Never check out or execute the PR's head with this credential.
  pull_request_target:
    types: [opened, edited, reopened, closed, ready_for_review, converted_to_draft, synchronize]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply status changes (otherwise report only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: polku-project-progress
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check project access
        env:
          GH_TOKEN: ${{ secrets.POLKU_PROJECT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'POLKU_PROJECT_TOKEN is missing. Follow docs/PROJECT_WORKFLOW.md.' >&2
            exit 1
          fi

      - name: Reconcile and report
        env:
          GH_TOKEN: ${{ secrets.POLKU_PROJECT_TOKEN }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          if [ "$APPLY" = true ]; then
            python3 tools/project.py sync --apply --output project-report.md
          else
            python3 tools/project.py sync --output project-report.md
          fi

      - name: Focus report
        if: always()
        run: |
          if [ -f project-report.md ]; then
            cat project-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Project check did not finish. Read the failing step; no complete report is available.' >> "$GITHUB_STEP_SUMMARY"
          fi
